<style>
:root {
    --primary: #163b4d;
    --secondary: #24778b;
    --accent: #d7ad6b;
    --background: #f5f7f8;
    --text: #42515c;
    --border: #e4e9ec;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #fff;
    color: var(--text);
    font-family: Tahoma, Arial, sans-serif;
    line-height: 1.9;
}

.container {
    width: min(1160px, 92%);
    margin: auto;
}

a {
    text-decoration: none;
    color: inherit;
}

.topbar {
    background: var(--primary);
    color: #dce9ee;
    font-size: 12px;
    padding: 9px 0;
}

.topbar .container {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

header {
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 0;
    gap: 25px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: var(--primary);
    line-height: 1.3;
}

.logo span {
    display: block;
    font-size: 11px;
    color: #81909b;
    font-weight: normal;
    letter-spacing: 1px;
}

nav {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
}

nav a {
    font-size: 14px;
    color: var(--primary);
}

nav a:hover {
    color: var(--secondary);
}

.hero {
    background:
        linear-gradient(110deg, rgba(22,59,77,.97), rgba(36,119,139,.88)),
        linear-gradient(45deg, #163b4d, #24778b);
    color: white;
    padding: 115px 0;
}

.hero-content {
    max-width: 800px;
}

.hero-label {
    color: #f0d2a2;
    font-size: 15px;
    font-weight: bold;
}

.hero h1 {
    font-size: clamp(32px, 5vw, 55px);
    line-height: 1.5;
    margin: 15px 0 22px;
}

.hero p {
    font-size: 17px;
    color: #e0edf0;
    max-width: 720px;
}

.hero-actions {
    display: flex;
    gap: 15px;
    margin-top: 30px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    background: var(--accent);
    color: var(--primary);
    padding: 12px 28px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
}

.btn-outline {
    background: transparent;
    border: 1px solid white;
    color: white;
}

section {
    padding: 85px 0;
}

.section-heading {
    margin-bottom: 45px;
}

.section-heading.center {
    text-align: center;
}

.section-heading span {
    color: var(--secondary);
    font-size: 14px;
    font-weight: bold;
}

.section-heading h2 {
    color: var(--primary);
    font-size: 32px;
    margin: 8px 0 10px;
}

.section-heading p {
    color: #7a8993;
    margin: 0;
}

.about-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 55px;
    align-items: center;
}

.about-text p {
    margin-bottom: 18px;
}

.about-panel {
    background: var(--background);
    padding: 35px;
    border-radius: 8px;
    border-top: 4px solid var(--accent);
}

.about-panel h3 {
    color: var(--primary);
    margin-bottom: 8px;
}

.about-panel p {
    margin-top: 0;
}

.services {
    background: var(--background);
}

.services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 23px;
}

.service {
    background: white;
    border: 1px solid var(--border);
    padding: 32px 28px;
    border-radius: 8px;
    transition: .2s;
}

.service:hover {
    transform: translateY(-4px);
    border-color: var(--secondary);
}

.service-number {
    color: var(--secondary);
    font-size: 18px;
    font-weight: bold;
}

.service h3 {
    color: var(--primary);
    font-size: 19px;
    margin: 13px 0;
}

.service p {
    font-size: 14px;
    margin: 0;
}

.activities-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.activity {
    padding: 22px 16px;
    text-align: center;
    border: 1px solid var(--border);
    background: #f8fafb;
    border-radius: 7px;
    color: var(--primary);
    font-weight: bold;
    font-size: 15px;
}

.activity.main {
    background: var(--primary);
    color: white;
    font-size: 21px;
}

.advantages {
    background: var(--background);
}

.advantages-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.advantage {
    background: white;
    padding: 30px;
    border-right: 3px solid var(--accent);
}

.advantage h3 {
    color: var(--primary);
    margin-top: 0;
}

.advantage p {
    font-size: 14px;
    margin-bottom: 0;
}

.company-data {
    background: white;
}

.data-wrapper {
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
}

.data-header {
    background: var(--primary);
    color: white;
    padding: 20px 25px;
    font-size: 20px;
    font-weight: bold;
}

.data-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
}

.data-item {
    padding: 20px 25px;
    border-bottom: 1px solid var(--border);
}

.data-item:nth-child(odd) {
    border-left: 1px solid var(--border);
}

.data-label {
    font-size: 12px;
    color: #84939c;
}

.data-value {
    font-size: 15px;
    color: var(--primary);
    font-weight: bold;
    margin-top: 5px;
    overflow-wrap: anywhere;
}

.data-value a {
    color: var(--secondary);
}

.license {
    background: var(--background);
}

.license-box {
    background: white;
    border: 1px solid var(--border);
    padding: 35px;
    border-radius: 9px;
}

.license-box h3 {
    color: var(--primary);
    margin-top: 0;
}

.license-details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 25px;
}

.license-item {
    background: var(--background);
    padding: 18px;
    border-radius: 6px;
}

.license-item small {
    display: block;
    color: #81909b;
}

.license-item strong {
    color: var(--primary);
}

.cta {
    background: var(--primary);
    color: white;
    text-align: center;
}

.cta h2 {
    font-size: 34px;
    margin: 0 0 15px;
}

.cta p {
    color: #d4e3e8;
    max-width: 700px;
    margin: 0 auto 25px;
}

.contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.contact-card {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 30px;
}

.contact-card h3 {
    color: var(--primary);
}

.contact-card a {
    color: var(--secondary);
    overflow-wrap: anywhere;
}

footer {
    background: #102b39;
    color: white;
    padding: 60px 0 20px;
}

.footer-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 40px;
}

.footer-brand {
    font-size: 28px;
    font-weight: bold;
}

footer p {
    color: #b8c9d1;
    font-size: 13px;
}

footer h3 {
    font-size: 16px;
}

footer a {
    display: block;
    color: #cbd7dc;
    font-size: 13px;
    margin: 8px 0;
}

.copyright {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #34515e;
    text-align: center;
    font-size: 12px;
    color: #b5c5cc;
}
